on: pull_request
name: Review
jobs:
  changelog:
    runs-on: ubuntu-latest
    name: Changelog should be updated
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Git fetch
        run: git fetch

      - name: Check that changelog has been updated.
        run: git diff --exit-code origin/${{ github.base_ref }} -- CHANGELOG.md && exit 1 || exit 0

  test:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The checkout belongs to the runner's uid, so the container has to write
      # to the bind mount as that uid rather than as the image's `deploy` user.
      - name: Run the container as the checkout owner
        run: echo "COMPOSE_USER=$(id -u):$(id -g)" >> "$GITHUB_ENV"

      # Tests run in the project's own compose stack, so the PHP version comes
      # from compose.yml rather than being repeated here.
      - name: Install dependencies
        run: docker compose run --rm --no-deps phpfpm composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: docker compose run --rm --no-deps phpfpm vendor/bin/phpunit
