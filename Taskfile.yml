# https://taskfile.dev — install with `brew install go-task` (or see docs).
# Run `task` (or `task --list-all`) to see all available commands.
#
# This plugin has no long-running stack, so everything runs in a one-off
# itkdev/php8.3-fpm container.

version: "3"

vars:
  # https://taskfile.dev/reference/templating/
  DOCKER_COMPOSE: '{{ .TASK_DOCKER_COMPOSE | default "docker compose" }}'

tasks:
  default:
    desc: List all tasks
    cmds:
      - task --list-all
    silent: true

  # -------------------------------------------------------------- Wrappers ---

  compose:
    desc: "Run a docker compose command. Example: task compose -- config."
    cmds:
      - "{{ .DOCKER_COMPOSE }} {{ .CLI_ARGS }}"

  php:
    desc: "Run a command in a one-off php container. Example: task php -- php --version."
    cmds:
      - task compose -- run --rm --no-deps phpfpm {{ .CLI_ARGS }}
    silent: true

  composer:
    desc: "Run a composer command. Example: task composer -- install."
    cmds:
      - task php -- composer {{ .CLI_ARGS }}
    silent: true

  # ------------------------------------------------------------ Lifecycle ---

  setup:
    desc: Install dev dependencies.
    cmds:
      - task composer -- install

  composer:normalize:
    desc: Normalize composer.json.
    cmds:
      - task composer -- normalize

  # ------------------------------------------------------------ PHP tests ---

  test:
    desc: "Run the PHP test suite. Example: task test -- --filter TimesheetData."
    cmds:
      - task php -- vendor/bin/phpunit {{ .CLI_ARGS }}
    silent: true

  lint:
    desc: Syntax-check all PHP files.
    cmds:
      - >-
        task php -- sh -c
        'find Controllers Model Repositories Services -name "*.php" -print0
        | xargs -0 -n1 -- php -l'
    silent: true

  # ------------------------------------------------------------- Analysis ---

  code-analysis:
    desc: Run static analysis (phpstan).
    env:
      PHP_MEMORY_LIMIT: 256M
    cmds:
      - task composer -- code-analysis

  coding-standards:check:
    desc: Check coding standards across PHP, markdown and shell.
    cmds:
      - task composer -- coding-standards-check
      - docker run --rm --volume "$PWD:/md" itkdev/markdownlint '**/*.md'
      - docker run --rm --volume "$PWD:/app" --workdir /app peterdavehello/shellcheck shellcheck --external-sources --source-path=SCRIPTDIR bin/create-release
      - docker run --rm --volume "$PWD:/app" --workdir /app peterdavehello/shellcheck shellcheck --external-sources --source-path=SCRIPTDIR bin/local.create-release

  coding-standards:apply:
    desc: Apply coding standards fixes across PHP and markdown.
    cmds:
      - task composer -- coding-standards-apply
      - docker run --rm --volume "$PWD:/md" itkdev/markdownlint '**/*.md' --fix
